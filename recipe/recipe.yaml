schema_version: 1

context:
  version: "1.1.0"

package:
  name: agent-client-protocol
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/a/agent-client-protocol/agent_client_protocol-${{ version }}.tar.gz
    sha256: 1ef6932a0d95aed6bed4fc9680ce78f3d552780b7fe4704722a177a1ea445040

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }}
    - pydantic >=2.7
    - pydantic-core >=2.18.1

tests:
  - python:
      imports:
        - acp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/agentclientprotocol/python-sdk
  summary: A Python implement of Agent Client Protocol (ACP, by Zed Industries).

extra:
  recipe-maintainers:
    - davidbrochart
